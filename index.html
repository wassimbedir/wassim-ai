<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wassim AI</title>

  <meta name="description" content="Wassim AI — مساحة أدبية للكتابة والنقد وتطوير الروايات والشعر.">

  <link rel="icon" type="image/jpeg" href="IMG_20260923_195409_648.jpg">

  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

  <!-- ============================= -->
  <!-- AUTH OVERLAY -->
  <!-- ============================= -->

  <div class="auth-overlay" id="authOverlay">

    <div class="auth-box">

      <div class="auth-logo">
        <img
          src="IMG_20260923_195409_648.jpg"
          alt="Wassim AI"
        >
      </div>

      <h2 id="authTitle">تسجيل الدخول</h2>

      <p id="authSubtitle">
        ادخل إلى مساحتك الأدبية.
      </p>

      <form id="authForm">

        <input
          type="text"
          id="authUsername"
          placeholder="اسم المستخدم"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="authPassword"
          placeholder="كلمة المرور"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          id="authSubmit"
        >
          دخول
        </button>

      </form>

      <p
        class="auth-error"
        id="authError"
      ></p>

      <button
        type="button"
        class="auth-switch"
        id="authSwitch"
      >
        ليس لديك حساب؟ إنشاء حساب
      </button>

    </div>

  </div>


  <!-- ============================= -->
  <!-- APP -->
  <!-- ============================= -->

  <div class="app">


    <!-- ============================= -->
    <!-- SIDEBAR -->
    <!-- ============================= -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-header">

        <div class="logo">

          <div class="logo-image">
            <img
              src="IMG_20260923_195409_648.jpg"
              alt="Wassim AI"
            >
          </div>

          <span>Wassim AI</span>

        </div>

        <button
          class="new-chat"
          id="newChat"
          title="محادثة جديدة"
        >
          ＋
        </button>

      </div>


      <!-- SEARCH -->

      <div class="search">

        <input
          type="text"
          id="searchInput"
          placeholder="بحث في المحادثات..."
        >

      </div>


      <!-- CHAT LIST -->

      <div
        class="chats"
        id="chatList"
      >

        <!-- يتم تحميل المحادثات من API -->

      </div>


      <!-- SIDEBAR FOOTER -->

      <div class="sidebar-footer">

        <div class="account">

          <div class="avatar">

            <img
              src="IMG_20260923_195409_648.jpg"
              alt="Wassim"
            >

          </div>

          <div class="account-info">

            <div
              class="account-name"
              id="accountName"
            >
              Wassim
            </div>

            <div class="account-status">
              حساب شخصي
            </div>

          </div>

          <button
            class="account-menu"
            id="accountMenu"
            type="button"
          >
            ⋮
          </button>

        </div>

        <div
          class="account-dropdown"
          id="accountDropdown"
        >

          <button
            type="button"
            id="logoutButton"
          >
            تسجيل الخروج
          </button>

        </div>

      </div>

    </aside>


    <!-- ============================= -->
    <!-- MAIN -->
    <!-- ============================= -->

    <main class="main">


      <!-- TOPBAR -->

      <header class="topbar">

        <button
          class="menu-button"
          id="menuButton"
          type="button"
          aria-label="فتح القائمة"
        >
          ☰
        </button>

        <div class="current-chat">

          <span
            id="currentChatTitle"
          >
            مساحة الكتابة
          </span>

        </div>

      </header>


      <!-- ============================= -->
      <!-- MESSAGES -->
      <!-- ============================= -->

      <section
        class="messages"
        id="messages"
      >


        <!-- ============================= -->
        <!-- WELCOME -->
        <!-- ============================= -->

        <div
          class="welcome"
          id="welcomeScreen"
        >

          <div class="welcome-content">

            <div class="welcome-logo">

              <img
                src="IMG_20260923_195409_648.jpg"
                alt="Wassim AI"
              >

            </div>


            <h1>
              مرحبًا بك في <span>Wassim AI</span>
            </h1>


            <p class="welcome-subtitle">
              مساحة أدبية تفكر معك، لا بدلًا منك.
            </p>


            <p class="welcome-description">
              اكتب، حلّل، طوّر روايتك، ابنِ شخصياتك،
              أو دعنا نعمل على نصك خطوة بخطوة.
            </p>


            <!-- QUICK ACTIONS -->

            <div class="quick-actions">


              <button
                class="quick-action"
                data-prompt="أريد أن أكتب قصيدة. ساعدني في بناء الفكرة والصور الشعرية والقافية دون أن تكتب بدلًا مني."
                type="button"
              >

                <span class="quick-icon">
                  🪶
                </span>

                <span>
                  اكتب قصيدة
                </span>

              </button>


              <button
                class="quick-action"
                data-prompt="أريد بناء رواية. ساعدني في تطوير الفكرة والشخصيات والأحداث والزمن والترابط."
                type="button"
              >

                <span class="quick-icon">
                  📖
                </span>

                <span>
                  ابنِ رواية
                </span>

              </button>


              <button
                class="quick-action"
                data-prompt="أريد كتابة نص أدبي. ساعدني في تطويره مع الحفاظ على أسلوبي وصوتي ككاتب."
                type="button"
              >

                <span class="quick-icon">
                  ✒️
                </span>

                <span>
                  اكتب نصًا أدبيًا
                </span>

              </button>


              <button
                class="quick-action"
                data-prompt="سأرسل لك نصًا أدبيًا. أريد نقدًا واضحًا ومباشرًا يحدد نقاط القوة والمشكلات والحلول المقترحة."
                type="button"
              >

                <span class="quick-icon">
                  🔍
                </span>

                <span>
                  حلّل نصي
                </span>

              </button>


            </div>

          </div>

        </div>


      </section>


      <!-- ============================= -->
      <!-- INPUT AREA -->
      <!-- ============================= -->

      <div class="input-area">

        <div class="input-container">


          <textarea
            id="messageInput"
            rows="1"
            placeholder="اكتب ما يدور في ذهنك..."
            autocomplete="off"
          ></textarea>


          <button
            id="sendButton"
            class="send-button"
            type="button"
            aria-label="إرسال"
          >

            <span>
              ↑
            </span>

          </button>


        </div>


        <div class="input-hint">
          Wassim AI — شريكك في الكتابة الأدبية
        </div>

      </div>


    </main>

  </div>


  <!-- ============================= -->
  <!-- MOBILE OVERLAY -->
  <!-- ============================= -->

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>


  <!-- ============================= -->
  <!-- SCRIPTS -->
  <!-- ============================= -->

  <script src="literary-core.js"></script>

  <script src="app.js"></script>


</body>

</html>
