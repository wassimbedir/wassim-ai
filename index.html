<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wassim AI</title>
  <meta name="description" content="Wassim AI — مساعدك الذكي">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">

      <div class="logo">
        <span>W</span>assim AI
      </div>

      <button class="new-chat" id="newChat" title="محادثة جديدة">
        ＋
      </button>

    </div>

    <div class="search">
      <input
        type="text"
        id="searchInput"
        placeholder="بحث في المحادثات..."
      >
    </div>

    <div class="chats" id="chatList">

      <div class="chat-date">
        اليوم
      </div>

      <div class="chat active">

        <div class="chat-icon">
          💬
        </div>

        <div class="chat-info">

          <div class="chat-title">
            مشروع Wassim AI
          </div>

          <div class="chat-preview">
            مرحبًا وسيم...
          </div>

        </div>

        <button class="chat-menu">
          ⋮
        </button>

      </div>

      <div class="chat">

        <div class="chat-icon">
          💬
        </div>

        <div class="chat-info">

          <div class="chat-title">
            أفكار الرواية
          </div>

          <div class="chat-preview">
            الفصل الجديد...
          </div>

        </div>

        <button class="chat-menu">
          ⋮
        </button>

      </div>

      <div class="chat-date">
        أمس
      </div>

      <div class="chat">

        <div class="chat-icon">
          💬
        </div>

        <div class="chat-info">

          <div class="chat-title">
            سؤال عن البرمجة
          </div>

          <div class="chat-preview">
            كيف يمكنني...
          </div>

        </div>

        <button class="chat-menu">
          ⋮
        </button>

      </div>

    </div>

    <div class="sidebar-footer">

      <div class="account">

        <div class="avatar">
          W
        </div>

        <div class="account-info">

          <div class="account-name">
            Wassim
          </div>

          <div class="account-status">
            حساب شخصي
          </div>

        </div>

        <div>
          ⋮
        </div>

      </div>

    </div>

  </aside>


  <!-- OVERLAY MOBILE -->

  <div class="overlay" id="overlay"></div>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button
        class="menu-button"
        id="menuButton"
        aria-label="فتح القائمة"
      >
        ☰
      </button>

      <div class="current-chat" id="currentChat">
        مشروع Wassim AI
      </div>

    </header>


    <!-- MESSAGES -->

    <section class="messages">

      <div class="message-container" id="messages">

        <!-- WELCOME -->

        <div class="welcome" id="welcome">

          <div class="welcome-content">

            <div class="welcome-logo">
              W
            </div>

            <h1>
              أنا <span>وسيم</span>
            </h1>

            <p>
              مساعدك الذكي.
              <br>
              ابدأ محادثة جديدة واكتب ما تريد.
            </p>

          </div>

        </div>

      </div>

    </section>


    <!-- INPUT -->

    <div class="input-area">

      <div class="input-wrapper">

        <textarea
          id="messageInput"
          class="message-input"
          placeholder="اكتب رسالتك إلى وسيم..."
          rows="1"
        ></textarea>

        <button
          id="sendButton"
          class="send-button"
          aria-label="إرسال"
        >
          ↑
        </button>

      </div>

      <div class="disclaimer">
        Wassim AI يمكن أن يخطئ. تحقق من المعلومات المهمة.
      </div>

    </div>

  </main>

</div>


<script src="app.js"></script>

</body>
    </html>
