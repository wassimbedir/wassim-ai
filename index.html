<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wassim AI</title>
  <meta name="description" content="Wassim AI — مساعدك الذكي">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      border-bottom: 1px solid #22222a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .logo span {
      color: #d4af37;
    }

    .status {
      font-size: 12px;
      color: #777;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px 100px;
    }

    .welcome {
      text-align: center;
      max-width: 700px;
      width: 100%;
    }

    .welcome h1 {
      font-size: clamp(32px, 8vw, 60px);
      margin-bottom: 15px;
    }

    .welcome h1 span {
      color: #d4af37;
    }

    .welcome p {
      color: #999;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .input-box {
      width: 100%;
      max-width: 650px;
      margin: auto;
      background: #15151c;
      border: 1px solid #292932;
      border-radius: 18px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-box textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 12px;
      min-height: 45px;
      font-family: inherit;
    }

    .input-box button {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 13px;
      background: #d4af37;
      color: #111;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .input-box button:hover {
      transform: scale(1.05);
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #555;
      font-size: 11px;
      background: #0b0b0f;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 14px;
      }

      main {
        padding-bottom: 80px;
      }

      .welcome p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <span>W</span>assim AI
    </div>

    <div class="status">
      الإصدار التجريبي
    </div>
  </header>

  <main>
    <section class="welcome">

      <h1>
        أنا <span>وسيم</span>
      </h1>

      <p>
        مساعدك الذكي، من تطوير Wassim Bedir.
        <br>
        اسألني أي شيء وابدأ المحادثة.
      </p>

      <div class="input-box">
        <textarea
          id="message"
          placeholder="اكتب رسالتك هنا..."
          rows="1"
        ></textarea>

        <button id="send">
          ↑
        </button>
      </div>

    </section>
  </main>

  <footer>
    Wassim AI © 2026
  </footer>

  <script>
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    send.addEventListener("click", () => {
      const message = input.value.trim();

      if (!message) return;

      alert("Wassim AI: النظام الذكي سيتم ربطه في المرحلة القادمة.");

      input.value = "";
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send.click();
      }
    });
  </script>

</body>
</html>
